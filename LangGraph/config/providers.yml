# Provider definitions for content_batch_graph's model calls.
# No provider is hardcoded in Python — add one here, it's available to every node
# that resolves a model through domain/providers.py. Priority breaks ties when more
# than one provider is enabled; lower number = tried first.
#
# client_type: "api" (cloud, needs env_var API key), "local" (runs on-machine via
#              Ollama, no key needed), or "batch" (offline OpenAI-compatible batch
#              API — resolved by domain/batch_providers.py, never by get_model()).
# package: which LangChain integration class to use for this provider.
#   "anthropic" -> langchain_anthropic.ChatAnthropic
#   "openai"    -> langchain_openai.ChatOpenAI (also covers any OpenAI-compatible
#                  endpoint via base_url — DashScope, Groq, Fireworks, etc.)
#   "cerebras"  -> langchain_cerebras.ChatCerebras
#   "ollama"    -> langchain_ollama.ChatOllama (local only)

providers:
  - id: cerebras_gpt_oss_120b
    name: "Cerebras/gpt-oss-120b"
    priority: 1
    enabled: true
    client_type: api
    package: cerebras
    model: "gpt-oss-120b"
    env_var: CEREBRAS_API_KEY

  # Switched from qwen2.5:0.5b to gemma4:26b on 2026-08-27 -- genuinely local (no
  # remote_host in `ollama list`, confirmed via /api/tags), zero quota/rate limit,
  # real structured-output test against this project's actual flag_pass schema
  # succeeded (2/2 injected typos caught correctly). Distinct from a same-named
  # "gemma4:31b-cloud" model also present locally -- that one routes through
  # Ollama's cloud inference (remote_host: https://ollama.com) and requires
  # separate cloud auth (confirmed via a real 401 Unauthorized); gemma4:26b is the
  # local-only variant.
  - id: ollama_local
    name: "Ollama/gemma4:26b (local)"
    priority: 2
    enabled: true
    client_type: local
    package: ollama
    model: "gemma4:26b"
    base_url: "http://localhost:11434"

  - id: cerebras_default
    name: "Cerebras/qwen-3-235b"
    priority: 3
    enabled: true
    client_type: api
    package: cerebras
    model: "qwen-3-235b-a22b-instruct-2507"
    env_var: CEREBRAS_API_KEY

  - id: groq_gpt_oss_120b
    name: "Groq/gpt-oss-120b"
    priority: 4
    enabled: true
    client_type: api
    package: openai
    base_url: "https://api.groq.com/openai/v1"
    model: "openai/gpt-oss-120b"
    env_var: GROQ_API_KEY
    # gpt-oss models are always-on chain-of-thought; default reasoning_effort
    # ("medium") sometimes burns the whole completion-token budget on reasoning
    # before emitting the structured JSON answer, failing with
    # json_validate_failed / "max completion tokens reached before generating a
    # valid document" (confirmed via a real call through content_batch_graph's
    # graph on 2026-08-27). low, per Groq's own docs, is supported by both
    # gpt-oss-20b and gpt-oss-120b and matches the fix already applied to the
    # Fireworks batch provider below for the same failure mode.
    extra_body:
      reasoning_effort: low

  - id: groq_gpt_oss_20b
    name: "Groq/gpt-oss-20b"
    priority: 4
    enabled: true
    client_type: api
    package: openai
    base_url: "https://api.groq.com/openai/v1"
    model: "openai/gpt-oss-20b"
    env_var: GROQ_API_KEY
    extra_body:
      reasoning_effort: low

  # Separate Groq account/key, same model -- its own independent 200K TPD quota.
  # groq_gpt_oss_20b and groq_gpt_oss_120b (same GROQ_API_KEY account) both hit
  # their daily cap on 2026-08-27 partway through scripts/run_live_validation.py's
  # run over the 2027 ES devotional file. This entry lets that run continue on a
  # fresh quota without waiting for either to reset.
  - id: groq_gpt_oss_20b_fallback
    name: "Groq/gpt-oss-20b (fallback account)"
    priority: 4
    enabled: true
    client_type: api
    package: openai
    base_url: "https://api.groq.com/openai/v1"
    model: "openai/gpt-oss-20b"
    env_var: GROQ_API_KEY_FALLBACK
    extra_body:
      reasoning_effort: low
  # Third and fourth independent Groq accounts/keys, same model -- own 200K TPD
  # quotas each, used as two more parallel workers for the 2027 ES live
  # validation run alongside ollama_local (2026-08-28), once fallback/main/120b
  # quotas were still cooling down.
  - id: groq_gpt_oss_20b_fallback2
    name: "Groq/gpt-oss-20b (fallback account 2)"
    priority: 4
    enabled: true
    client_type: api
    package: openai
    base_url: "https://api.groq.com/openai/v1"
    model: "openai/gpt-oss-20b"
    env_var: GROQ_API_KEY_FALLBACK_2
    extra_body:
      reasoning_effort: low

  - id: groq_gpt_oss_20b_fallback3
    name: "Groq/gpt-oss-20b (fallback account 3)"
    priority: 4
    enabled: true
    client_type: api
    package: openai
    base_url: "https://api.groq.com/openai/v1"
    model: "openai/gpt-oss-20b"
    env_var: GROQ_API_KEY_FALLBACK_3
    extra_body:
      reasoning_effort: low


  - id: fireworks_deepseek_v4_flash
    name: "Fireworks/deepseek-v4-flash-0731"
    priority: 4
    enabled: true
    client_type: api
    package: openai
    # Live chat-completions endpoint (.../inference/v1) — different host path
    # than fireworks_batch_devotional_gen's .../v1 batch/dataset API below.
    base_url: "https://api.fireworks.ai/inference/v1"
    model: "accounts/fireworks/models/deepseek-v4-flash-0731"
    env_var: FIREWORKS_API_KEY

  - id: anthropic_default
    name: "Anthropic/claude-sonnet"
    priority: 5
    enabled: true
    client_type: api
    package: anthropic
    model: "claude-sonnet-4-20250514"
    env_var: ANTHROPIC_API_KEY

  - id: openai_default
    name: "OpenAI/gpt-4o-mini"
    priority: 6
    enabled: true
    client_type: api
    package: openai
    model: "gpt-4o-mini"
    env_var: OPENAI_API_KEY

  # Batch-only entry: resolved by domain/batch_providers.py into a
  # batch_common.BatchProviderConfig for offline JSONL batch generation. It has no
  # priority and is deliberately excluded from get_model() — nothing here builds a
  # live ChatOpenAI, the requests go through the async batch API instead.
  - id: fireworks_batch_devotional_gen
    name: "Fireworks/deepseek-v4-flash-0731 (batch)"
    enabled: true
    client_type: batch
    package: openai
    # NOT the same host path as the live chat-completions API (.../inference/v1)
    # — Fireworks' batch/dataset management API (datasets, batchInferenceJobs)
    # lives under plain /v1, confirmed against every curl example in
    # docs.fireworks.ai/guides/batch-inference after a real 404 on
    # .../inference/v1/accounts/{id}/datasets proved the /inference/v1 base wrong
    # for this entry.
    base_url: "https://api.fireworks.ai/v1"
    model: "accounts/fireworks/models/deepseek-v4-flash-0731"
    env_var: FIREWORKS_API_KEY
    account_id_env_var: FIREWORKS_ACCOUNT_ID
    batch:
      supported: true
      endpoint: "/v1/chat/completions"
      completion_window: "24h"
      # gpt-oss-20b can't fully disable reasoning (architecturally always-on
      # CoT) — a real batch test with no reasoning_effort set blew the 4098
      # max_tokens budget on reasoning alone for 3/5 rows (finish_reason:
      # length, no content field at all). reasoning_effort:"low", passed via
      # inferenceParameters.extraBody at job-submission time (confirmed as a
      # documented field there, not per-record — Fireworks' own API reference
      # lists extraBody only inside inferenceParameters), fixed this: a real
      # retest got 5/5 clean completions with completion_tokens dropping from
      # ~2800-4098 to 360-1825 per row.
      extra_body:
        reasoning_effort: low

settings:
  # cerebras_gpt_oss_120b: chosen after comparing it against zai-glm-4.7 and
  # gemma-4-31b (see PLAN.md) — same rate/token limits across all three, but
  # gpt-oss-120b is the only Production-status model (the other two are Preview,
  # and zai-glm-4.7 is scheduled for deprecation 2026-08-17), gave the most
  # consistent low latency, and was the most willing to actually surface real
  # findings on real content rather than under-flag.
  #
  # default_provider temporarily switched off cerebras_gpt_oss_120b on
  # 2026-08-17: Cerebras' free API tier was cut off that same day (account
  # requires a payment method now), causing 429 queue_exceeded on every call.
  # Tried groq_gpt_oss_20b first (free-tier, no credit-history gate) but it
  # hit both an 8000 TPM/min cap and repeated json_validate_failed
  # structured-output errors on the critic pass's nested schema. Switched to
  # groq_gpt_oss_120b for better instruction-following reliability, which
  # worked well until it hit Groq's 200K TPD/day cap with 13 items left in
  # the PT ARC batch. Switched back to groq_gpt_oss_20b (separate daily
  # quota, mostly unused) to close out the remainder. Revert to
  # cerebras_gpt_oss_120b once Cerebras access is restored.
  #
  # 2026-08-27: groq_gpt_oss_20b hit its own 200K TPD cap partway through the
  # scripts/run_live_validation.py run over the 2027 ES devotional file (8/732
  # items done). Switched to groq_gpt_oss_120b (separate daily quota) to
  # continue, which also hit its own 200K TPD cap at 146/732. Switched to
  # groq_gpt_oss_20b_fallback (separate account/key, GROQ_API_KEY_FALLBACK,
  # its own independent quota) to continue the same run further.
  default_provider: groq_gpt_oss_20b_fallback
  max_retries: 2
  retry_delay_s: 5

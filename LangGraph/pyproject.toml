[project]
name = "content-batch-graph"
version = "0.1.0"
description = "A LangGraph pipeline automating batch content review: translate/generate, independent critic rounds, verified triage, fix, validate, human confirmation."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint-sqlite>=3.1,<4.0",
    "langchain-core>=1.5,<2.0",
    "langchain-anthropic>=1.5,<2.0",
    "langchain-openai>=1.4,<2.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.2,<2.0",
    "langchain-cerebras>=0.8,<0.9",
    "langchain-ollama>=1.1,<2.0",
    "devocionales-json",
    "batch-common",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[project.scripts]
content-batch = "content_batch_graph.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
# Local sibling checkout, editable — devocionales-json is a separate repo on this
# machine, not a workspace member. review_fields.py (on its reorg-shared-validation
# branch, not yet merged to main) was purpose-built for this project's field-path
# format; this stays live as that branch evolves instead of a one-time copy.
devocionales-json = { path = "../devocionales-json", editable = true }

# Sibling package in this repo, editable — the OpenAI-compatible batch transport
# (upload/submit/poll/download) shared with GEP. Stdlib-only, so depending on it
# adds no third-party surface to this project.
batch-common = { path = "../batch_common", editable = true }
